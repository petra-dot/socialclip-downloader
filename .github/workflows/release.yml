name: release

# Builds standalone binaries for Windows, macOS and Linux on every v* tag
# and attaches them to the GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: socialclip-windows
            path: dist/socialclip-downloader-windows.exe
          - os: macos-latest
            artifact: socialclip-macos
            path: dist/socialclip-downloader-macos
          - os: ubuntu-latest
            artifact: socialclip-linux
            path: dist/socialclip-downloader-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pyinstaller --onefile --windowed --name socialclip-downloader-windows \
              --icon assets/icon.ico socialclip_downloader.py
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            pyinstaller --onefile --windowed --name socialclip-downloader-macos \
              --osx-bundle-identifier com.socialclip.downloader socialclip_downloader.py
          else
            # Plain binary, no --windowed: that flag needs libpython shared
            # libs the manylinux runners do not ship.
            pyinstaller --onefile --name socialclip-downloader-linux socialclip_downloader.py
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if ! gh api "repos/$repo/releases/tags/$tag" >/dev/null 2>&1; then
            printf '{"tag_name":"%s","name":"%s","generate_release_notes":true}' "$tag" "$tag" \
              | gh api --method POST "repos/$repo/releases" --input -
          fi
          gh release upload "$tag" artifacts/*/* --repo "$repo" --clobber
