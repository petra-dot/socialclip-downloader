name: release

# Builds standalone binaries for Windows, macOS and Linux on every v* tag
# and attaches them to the GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_short: windows
            artifact: socialclip-windows
            path: dist/socialclip-downloader-windows.exe
            cli_path: dist/socialclip-windows.exe
          - os: macos-latest
            os_short: macos
            artifact: socialclip-macos
            path: dist/socialclip-downloader-macos
            cli_path: dist/socialclip-macos
          - os: ubuntu-latest
            os_short: linux
            artifact: socialclip-linux
            path: dist/socialclip-downloader-linux
            cli_path: dist/socialclip-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches __version__
        shell: bash
        run: |
          version=$(python -c "import socialclip_downloader; print(socialclip_downloader.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match __version__ $version"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install imageio-ffmpeg

      - name: Fetch bundled ffmpeg
        shell: bash
        run: |
          python - <<'PY'
          import imageio_ffmpeg, shutil, os
          src = imageio_ffmpeg.get_ffmpeg_exe()
          ext = ".exe" if os.name == "nt" else ""
          os.makedirs("bundled", exist_ok=True)
          shutil.copy(src, os.path.join("bundled", "ffmpeg" + ext))
          print("bundled:", src, os.path.getsize(src))
          PY
          # NOTE: imageio-ffmpeg ships ffmpeg only, so the bundle has no
          # ffprobe and ffprobe_path() falls back to PATH. The maintenance
          # installer supplies both ffmpeg and ffprobe in the data dir.
          ls -la bundled/

      - name: Fetch bundled deno
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import hashlib, io, os, re, stat, sys, urllib.request, zipfile

          os_name = os.environ["OS"]
          if os_name == "windows-latest":
              asset, ext = "deno-x86_64-pc-windows-msvc.zip", ".exe"
          elif os_name == "macos-latest":
              asset, ext = "deno-x86_64-apple-darwin.zip", ""
          else:
              asset, ext = "deno-x86_64-unknown-linux-gnu.zip", ""

          base = "https://github.com/denoland/deno/releases/latest/download"
          data = urllib.request.urlopen(base + "/" + asset).read()
          sums = urllib.request.urlopen(
              base + "/" + asset + ".sha256sum").read().decode("utf-8")

          match = re.search(r"[0-9a-fA-F]{64}", sums)
          if not match:
              sys.exit("no SHA-256 digest in %s.sha256sum" % asset)
          expected = match.group(0).lower()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              sys.exit("deno checksum mismatch for %s: %s != %s"
                       % (asset, actual, expected))

          os.makedirs("bundled", exist_ok=True)
          out = os.path.join("bundled", "deno" + ext)
          with zipfile.ZipFile(io.BytesIO(data)) as zf:
              name = next(n for n in zf.namelist()
                          if os.path.basename(n).startswith("deno"))
              with zf.open(name) as src, open(out, "wb") as fh:
                  fh.write(src.read())
          if not ext:
              os.chmod(out, os.stat(out).st_mode
                       | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          print("bundled deno:", out, os.path.getsize(out))
          PY
          ls -la bundled/

      - name: Build binary
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
          ADD="--add-binary bundled/ffmpeg$EXT:."
          # deno lands under a bundled/ path inside the archive, which
          # utils.ytdlp._bundle_dir() reads from sys._MEIPASS.
          BUNDLED="--add-binary bundled/deno$EXT:bundled"
          # Bundle the icon file too: --icon only sets the executable's icon,
          # it does not make assets/icon.ico resolvable at runtime.
          DATA="--add-data assets/icon.ico:assets"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pyinstaller --onefile --windowed --name socialclip-downloader-windows \
              $ADD $BUNDLED $DATA --icon assets/icon.ico socialclip_downloader.py
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            pyinstaller --onefile --windowed --name socialclip-downloader-macos \
              $ADD $BUNDLED $DATA --osx-bundle-identifier com.socialclip.downloader socialclip_downloader.py
          else
            # Plain binary, no --windowed: that flag needs libpython shared
            # libs the manylinux runners do not ship.
            pyinstaller --onefile --name socialclip-downloader-linux \
              $ADD $BUNDLED $DATA socialclip_downloader.py
          fi
          # Console CLI build: the --windowed GUI binary has no stdout on
          # Windows, so the CLI ships as its own --console executable.
          pyinstaller --onefile --console --name socialclip-${{ matrix.os_short }} \
            $ADD $BUNDLED cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.path }}
            ${{ matrix.cli_path }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if ! gh api "repos/$repo/releases/tags/$tag" >/dev/null 2>&1; then
            printf '{"tag_name":"%s","name":"%s","generate_release_notes":true}' "$tag" "$tag" \
              | gh api --method POST "repos/$repo/releases" --input -
          fi
          gh release upload "$tag" artifacts/*/* --repo "$repo" --clobber
