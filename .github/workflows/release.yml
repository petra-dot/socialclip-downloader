name: release

# Builds standalone binaries for Windows, macOS and Linux on every v* tag
# and attaches them to the GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_short: windows
            artifact: socialclip-windows
            path: dist/socialclip-downloader-windows.exe
            cli_path: dist/socialclip-windows.exe
          - os: macos-latest
            os_short: macos
            artifact: socialclip-macos
            path: dist/socialclip-downloader-macos
            cli_path: dist/socialclip-macos
          - os: ubuntu-latest
            os_short: linux
            artifact: socialclip-linux
            path: dist/socialclip-downloader-linux
            cli_path: dist/socialclip-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches __version__
        shell: bash
        run: |
          version=$(python -c "import socialclip_downloader; print(socialclip_downloader.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match __version__ $version"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install imageio-ffmpeg

      - name: Fetch bundled ffmpeg
        shell: bash
        run: |
          python - <<'PY'
          import imageio_ffmpeg, shutil, os
          src = imageio_ffmpeg.get_ffmpeg_exe()
          ext = ".exe" if os.name == "nt" else ""
          os.makedirs("bundled", exist_ok=True)
          shutil.copy(src, os.path.join("bundled", "ffmpeg" + ext))
          print("bundled:", src, os.path.getsize(src))
          PY
          # ffprobe ships alongside the imageio-ffmpeg binary on some builds;
          # fall back to the ffmpeg binary if a separate ffprobe is unavailable.
          ls -la bundled/

      - name: Build binary
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
          ADD="--add-binary bundled/ffmpeg$EXT:."
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pyinstaller --onefile --windowed --name socialclip-downloader-windows \
              $ADD --icon assets/icon.ico socialclip_downloader.py
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            pyinstaller --onefile --windowed --name socialclip-downloader-macos \
              $ADD --osx-bundle-identifier com.socialclip.downloader socialclip_downloader.py
          else
            # Plain binary, no --windowed: that flag needs libpython shared
            # libs the manylinux runners do not ship.
            pyinstaller --onefile --name socialclip-downloader-linux \
              $ADD socialclip_downloader.py
          fi
          # Console CLI build: the --windowed GUI binary has no stdout on
          # Windows, so the CLI ships as its own --console executable.
          pyinstaller --onefile --console --name socialclip-${{ matrix.os_short }} \
            $ADD cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.path }}
            ${{ matrix.cli_path }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if ! gh api "repos/$repo/releases/tags/$tag" >/dev/null 2>&1; then
            printf '{"tag_name":"%s","name":"%s","generate_release_notes":true}' "$tag" "$tag" \
              | gh api --method POST "repos/$repo/releases" --input -
          fi
          gh release upload "$tag" artifacts/*/* --repo "$repo" --clobber
